<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Umbral">
  <!--
    La cinta, reduced to what survives at 16px: two marks and the span between
    them. Everything else in the hero - the tape rule, the tick labels, the
    settle animation - disappears at favicon size, so it is not drawn here.

    The span sits in the lower third rather than centred. Centred, two equal
    marks with a crossbar read as a letter H.

    Ink tile rather than a transparent glyph, so the mark colour holds on both a
    light and a dark browser tab. Colours are the tokens from globals.css.
  -->
  <rect width="32" height="32" rx="7" fill="#101a24"/>
  <rect x="6" y="5" width="3.8" height="22" rx="1.1" fill="#ff5a1f"/>
  <rect x="22.2" y="5" width="3.8" height="22" rx="1.1" fill="#ff5a1f"/>
  <rect x="9.8" y="19.3" width="12.4" height="3.4" fill="#f1f3ef"/>
</svg>
